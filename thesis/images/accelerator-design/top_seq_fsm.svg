<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 470" width="1000" height="470"
     font-family="Helvetica, Arial, sans-serif">
  <title>top_seq: the program sequencer's state machine</title>
  <desc>The main loop fetches eight instruction words, requests the layer's weights and
        parameters from the DMA, starts the feeder that owns the opcode, waits for busy
        to rise and then to fall, idles GAP_CYC cycles and advances. The three waiting
        states are the ones that used to hang: an opcode-validity check at S_GO and one
        watchdog shared across S_LOAD, S_WAIT and S_RUN divert every stall to S_ERR,
        which is sticky and leaves only by reset.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- ===================== the main loop, left to right ===================== -->
  <g fill="#f8fafc" stroke="#374151" stroke-width="1.8">
    <rect x="24"  y="150" width="118" height="62" rx="8"/>
    <rect x="182" y="150" width="118" height="62" rx="8"/>
    <rect x="340" y="150" width="118" height="62" rx="8"/>
    <rect x="498" y="150" width="118" height="62" rx="8"/>
    <rect x="656" y="150" width="118" height="62" rx="8"/>
    <rect x="814" y="150" width="118" height="62" rx="8"/>
  </g>
  <g font-size="19" text-anchor="middle" fill="#1f2937">
    <text x="83"  y="178">S_IDLE</text>
    <text x="241" y="178">S_FETCH</text>
    <text x="399" y="178">S_LOAD</text>
    <text x="557" y="178">S_GO</text>
    <text x="715" y="178">S_WAIT</text>
    <text x="873" y="178">S_RUN</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#6b7280">
    <text x="83"  y="200">idle</text>
    <text x="241" y="200">8 words</text>
    <text x="399" y="200">ld_req</text>
    <text x="557" y="200">op_start</text>
    <text x="715" y="200">busy rises</text>
    <text x="873" y="200">busy falls</text>
  </g>

  <!-- transitions along the loop -->
  <g stroke="#374151" stroke-width="1.8">
    <line x1="142" y1="181" x2="179" y2="181" marker-end="url(#ah)"/>
    <line x1="300" y1="181" x2="337" y2="181" marker-end="url(#ah)"/>
    <line x1="458" y1="181" x2="495" y2="181" marker-end="url(#ah)"/>
    <line x1="616" y1="181" x2="653" y2="181" marker-end="url(#ah)"/>
    <line x1="774" y1="181" x2="811" y2="181" marker-end="url(#ah)"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#6b7280">
    <text x="162" y="238">start</text>
    <text x="320" y="238">fw = 7</text>
    <text x="478" y="238">ld_done</text>
    <text x="794" y="238">op_busy</text>
  </g>

  <!-- ===================== S_GAP, and the loop back ===================== -->
  <rect x="656" y="282" width="118" height="62" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.8"/>
  <text x="715" y="310" text-anchor="middle" font-size="19" fill="#1f2937">S_GAP</text>
  <text x="715" y="332" text-anchor="middle" font-size="17" fill="#6b7280">5 cycles</text>

  <polyline points="873,212 873,313 778,313" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="893" y="262" font-size="17" fill="#6b7280">!op_busy</text>

  <!-- back to S_FETCH for the next instruction, or to S_IDLE when done -->
  <polyline points="656,313 241,313 241,215" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="448" y="305" text-anchor="middle" font-size="17" fill="#6b7280">pc + 1 &lt; n_instr</text>

  <polyline points="500,313 500,392 83,392 83,215" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="292" y="384" text-anchor="middle" font-size="17" fill="#6b7280">last instruction &#8212; done</text>
  <circle cx="500" cy="313" r="4" fill="#374151"/>

  <!-- ===================== the error paths ===================== -->
  <rect x="340" y="40" width="276" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="478" y="68" text-anchor="middle" font-size="19" fill="#1f2937">S_ERR</text>
  <text x="478" y="90" text-anchor="middle" font-size="17" fill="#6b7280">sticky fault &#183; leaves only by reset</text>

  <g stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 4">
    <!-- illegal opcode, checked at S_GO -->
    <polyline points="557,150 557,126 505,126 505,105" fill="none" marker-end="url(#ahr)"/>
    <!-- watchdog from S_LOAD -->
    <polyline points="399,150 399,126 451,126 451,105" fill="none" marker-end="url(#ahr)"/>
    <!-- watchdog from S_WAIT and S_RUN -->
    <polyline points="715,150 715,126 609,126 600,105" fill="none" marker-end="url(#ahr)"/>
    <polyline points="873,150 873,118 624,118 616,105" fill="none" marker-end="url(#ahr)"/>
  </g>
  <text x="330" y="140" text-anchor="end" font-size="17" fill="#b45309">watchdog</text>
  <text x="548" y="145" text-anchor="end" font-size="17" fill="#b45309">illegal opcode</text>
  <text x="952" y="140" text-anchor="end" font-size="17" fill="#b45309">watchdog</text>

  <!-- ===================== legend ===================== -->
  <line x1="24" y1="432" x2="68" y2="432" stroke="#374151" stroke-width="1.8"/>
  <text x="78" y="438" font-size="17" fill="#6b7280">the normal loop, once per instruction</text>
  <line x1="420" y1="432" x2="464" y2="432" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="474" y="438" font-size="17" fill="#6b7280">added after T-2: every stall now terminates</text>
</svg>
