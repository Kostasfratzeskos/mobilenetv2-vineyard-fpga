<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 360" width="1000" height="360"
     font-family="Helvetica, Arial, sans-serif">
  <title>requantize: the four pipeline stages of one lane</title>
  <desc>One requantization lane as four register stages: the biased accumulator, the
        multiply by the fixed-point multiplier M0, the round-and-shift, and the clamp.
        Each per-channel or per-layer parameter is delayed to the stage that consumes
        it rather than presented at the input, so a stale parameter cannot meet live
        data. The intermediate is carried at the full 59 bits and only the clamp
        narrows it to int8.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- ===================== the parameters, one per stage ===================== -->
  <text x="20" y="40" font-size="20" fill="#b45309">Parameters</text>
  <text x="20" y="62" font-size="17" fill="#6b7280">per channel / per layer</text>

  <g fill="#fffbeb" stroke="#b45309" stroke-width="1.5">
    <rect x="196" y="24" width="140" height="40" rx="4"/>
    <rect x="368" y="24" width="140" height="40" rx="4"/>
    <rect x="540" y="24" width="140" height="40" rx="4"/>
    <rect x="712" y="24" width="268" height="40" rx="4"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#1f2937">
    <text x="266" y="50">bias</text>
    <text x="438" y="50">M0</text>
    <text x="610" y="50">shift</text>
    <text x="846" y="50">act, relu6_qmax</text>
  </g>
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="7 4">
    <line x1="266" y1="64" x2="266" y2="128" marker-end="url(#aha)"/>
    <line x1="438" y1="64" x2="438" y2="128" marker-end="url(#aha)"/>
    <line x1="610" y1="64" x2="610" y2="128" marker-end="url(#aha)"/>
    <line x1="846" y1="64" x2="846" y2="128" marker-end="url(#aha)"/>
  </g>

  <!-- ===================== the four stages ===================== -->
  <g fill="#f8fafc" stroke="#374151" stroke-width="1.5">
    <rect x="196" y="131" width="140" height="78" rx="6"/>
    <rect x="368" y="131" width="140" height="78" rx="6"/>
    <rect x="540" y="131" width="140" height="78" rx="6"/>
    <rect x="712" y="131" width="268" height="78" rx="6"/>
  </g>
  <g font-size="19" text-anchor="middle" fill="#1f2937">
    <text x="266" y="166">acc + bias</text>
    <text x="438" y="166">&#215; M0</text>
    <text x="610" y="166">+ half, &#62;&#62;</text>
    <text x="846" y="166">clamp</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#6b7280">
    <text x="266" y="192">stage 1</text>
    <text x="438" y="192">stage 2</text>
    <text x="610" y="192">stage 3</text>
    <text x="846" y="192">stage 4</text>
  </g>

  <!-- the datapath -->
  <line x1="150" y1="170" x2="193" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <line x1="336" y1="170" x2="365" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <line x1="508" y1="170" x2="537" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <line x1="680" y1="170" x2="709" y2="170" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>

  <text x="20" y="165" font-size="20" fill="#1f2937">acc</text>
  <text x="20" y="188" font-size="17" fill="#6b7280">26 bit</text>

  <!-- out -->
  <text x="846" y="236" text-anchor="middle" font-size="17" fill="#6b7280">int8, or int16 for the logits</text>

  <!-- ===================== the widths carried between stages ============= -->
  <g font-size="17" text-anchor="middle" fill="#6b7280">
    <text x="438" y="268">full 59-bit product and sum, never truncated</text>
  </g>
  <line x1="200" y1="248" x2="676" y2="248" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="200" y1="242" x2="200" y2="254" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="676" y1="242" x2="676" y2="254" stroke="#9ca3af" stroke-width="1.2"/>

  <line x1="716" y1="248" x2="976" y2="248" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="716" y1="242" x2="716" y2="254" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="976" y1="242" x2="976" y2="254" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="846" y="268" text-anchor="middle" font-size="17" fill="#6b7280">the only narrowing</text>

  <!-- ===================== the bank ===================== -->
  <rect x="20" y="296" width="960" height="48" rx="5" fill="#fbfbfd" stroke="#374151" stroke-width="2"/>
  <text x="500" y="326" text-anchor="middle" font-size="19" fill="#1f2937">32 such lanes, one per accumulator &#8212; the whole 256-bit word in one cycle</text>
</svg>
