<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 576" width="1000" height="576"
     font-family="Helvetica, Arial, sans-serif">
  <title>pe_array: the pointwise MAC array</title>
  <desc>32 lanes, one per output channel, each with 16 multipliers, an adder tree and
        an accumulator. One word of 16 activations is broadcast to every lane; each
        lane reads its own 16 weights from its own bank of the weight buffer. The 32
        accumulators feed the shared output stage, which writes back to the pool.</desc>

  <defs>
    <!-- Fixed-size arrowheads (user units, not stroke widths), so a thick bus and a
         thin wire get the same head. The tip sits 3 units past the line's end:
         every arrow below stops 3 short of the edge it points at. -->
    <marker id="ah" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 8" refX="7.5" refY="4" markerWidth="12" markerHeight="9.6"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>

    <!-- One lane (mac_lane), drawn once at the origin and placed three times. Its
         title is not part of it. Rows: multipliers, adder tree, accumulator. -->
    <g id="lane">
      <rect x="0" y="150" width="200" height="306" rx="6" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>

      <!-- 16 multipliers, three drawn -->
      <rect x="12" y="198" width="176" height="56" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
      <g fill="#ffffff" stroke="#374151" stroke-width="1.4">
        <circle cx="36" cy="228" r="13"/>
        <circle cx="78" cy="228" r="13"/>
        <circle cx="162" cy="228" r="13"/>
      </g>
      <path d="M30,222 L42,234 M42,222 L30,234 M72,222 L84,234 M84,222 L72,234 M156,222 L168,234 M168,222 L156,234"
            stroke="#374151" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#9ca3af">
        <circle cx="108" cy="228" r="2.5"/>
        <circle cx="120" cy="228" r="2.5"/>
        <circle cx="132" cy="228" r="2.5"/>
      </g>

      <!-- products into the adder tree -->
      <path d="M36,241 L36,280 M78,241 L78,280 M162,241 L162,280" stroke="#374151" stroke-width="1.4"/>
      <path d="M16,280 L184,280 L128,320 L72,320 Z" fill="#f3f4f6" stroke="#374151" stroke-width="1.4"/>

      <!-- accumulator: adder, register, feedback -->
      <line x1="100" y1="320" x2="100" y2="340" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
      <circle cx="100" cy="358" r="15" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <path d="M100,350 L100,366 M92,358 L108,358" stroke="#374151" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="100" y1="373" x2="100" y2="389" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
      <rect x="64" y="392" width="72" height="36" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="1.4"/>
      <path d="M64,403 L73,410 L64,417" fill="none" stroke="#374151" stroke-width="1.2"/>
      <polyline points="136,410 166,410 166,358 118,358" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

      <!-- result, out of the lane -->
      <line x1="100" y1="428" x2="100" y2="491" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
    </g>
  </defs>

  <rect width="1000" height="576" fill="#ffffff"/>

  <!-- ===================== the lanes ===================== -->
  <use xlink:href="#lane" x="240"/>
  <use xlink:href="#lane" x="470"/>
  <use xlink:href="#lane" x="780"/>

  <g font-size="19" text-anchor="middle" fill="#1f2937">
    <text x="340" y="177">lane 0</text>
    <text x="570" y="177">lane 1</text>
    <text x="880" y="177">lane 31</text>
  </g>

  <!-- lanes 2 .. 30 -->
  <g fill="#9ca3af">
    <circle cx="711" cy="303" r="3.5"/>
    <circle cx="725" cy="303" r="3.5"/>
    <circle cx="739" cy="303" r="3.5"/>
  </g>

  <!-- ===================== row labels ===================== -->
  <g font-size="18" text-anchor="end" fill="#6b7280">
    <text x="226" y="232">16 multipliers</text>
    <text x="226" y="306">adder tree</text>
    <text x="226" y="390">accumulator</text>
  </g>

  <!-- ===================== activations: one word, broadcast ===================== -->
  <rect x="20" y="24" width="190" height="50" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="115" y="56" text-anchor="middle" font-size="20" fill="#1f2937">Activation pool</text>

  <text x="240" y="38" font-size="18" fill="#1d4ed8">16 activations · broadcast to all lanes</text>
  <polyline points="210,49 923,49 923,195" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <line x1="383" y1="49" x2="383" y2="195" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <line x1="613" y1="49" x2="613" y2="195" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <g fill="#1d4ed8">
    <circle cx="383" cy="49" r="4"/>
    <circle cx="613" cy="49" r="4"/>
  </g>

  <!-- ===================== weights: one bank per lane ===================== -->
  <text x="226" y="115" text-anchor="end" font-size="20" fill="#b45309">Weight buffer</text>
  <g fill="#fffbeb" stroke="#b45309" stroke-width="1.5">
    <rect x="257" y="88" width="80" height="40" rx="4"/>
    <rect x="487" y="88" width="80" height="40" rx="4"/>
    <rect x="797" y="88" width="80" height="40" rx="4"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#1f2937">
    <text x="297" y="114">bank 0</text>
    <text x="527" y="114">bank 1</text>
    <text x="837" y="114">bank 31</text>
  </g>
  <g fill="#9ca3af">
    <circle cx="711" cy="108" r="3.5"/>
    <circle cx="725" cy="108" r="3.5"/>
    <circle cx="739" cy="108" r="3.5"/>
  </g>
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="7 4">
    <line x1="297" y1="128" x2="297" y2="195" marker-end="url(#aha)"/>
    <line x1="527" y1="128" x2="527" y2="195" marker-end="url(#aha)"/>
    <line x1="837" y1="128" x2="837" y2="195" marker-end="url(#aha)"/>
  </g>

  <!-- ===================== the shared output stage ===================== -->
  <rect x="240" y="494" width="740" height="62" rx="5" fill="#fbfbfd" stroke="#374151" stroke-width="2"/>
  <text x="610" y="520" text-anchor="middle" font-size="21" fill="#1f2937">Shared output stage</text>
  <text x="610" y="544" text-anchor="middle" font-size="17" fill="#6b7280">bias add + requantize · 32 lanes</text>

  <!-- its int8 results go back to the pool -->
  <polyline points="240,525 60,525 60,77" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
</svg>
