<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770"
     font-family="Helvetica, Arial, sans-serif">
  <title>accel_top: the proposed accelerator, top level</title>
  <desc>A program sequencer steps through 64 instructions. Each instruction activates exactly
        one compute engine; every engine shares one output stage and one on-chip activation
        pool, which is read back as the next layer's input. Weights stream from DDR into the
        three convolution engines.</desc>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#6b7280"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aha" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1000" height="770" fill="#ffffff"/>

  <!-- ===================== outside the chip ===================== -->
  <rect x="368" y="24" width="260" height="64" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="498" y="51" text-anchor="middle" font-size="22" fill="#1f2937">Processing System</text>
  <text x="498" y="74" text-anchor="middle" font-size="17" fill="#6b7280">program · start · result</text>

  <rect x="690" y="24" width="240" height="64" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="810" y="51" text-anchor="middle" font-size="22" fill="#b45309">DDR memory</text>
  <text x="810" y="74" text-anchor="middle" font-size="17" fill="#6b7280">weights · input image</text>

  <!-- ===================== the accelerator ===================== -->
  <rect x="30" y="118" width="900" height="622" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="48" y="145" font-size="20" fill="#374151">accel_top — the accelerator on the PL</text>

  <!-- the PS loads a program and starts it -->
  <line x1="498" y1="88" x2="498" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="512" y="113" font-size="17" fill="#6b7280">64-instruction program</text>

  <!-- ===================== sequencer ===================== -->
  <rect x="368" y="166" width="260" height="88" rx="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="498" y="198" text-anchor="middle" font-size="22" fill="#1f2937">Program sequencer</text>
  <text x="498" y="222" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#6b7280">top_seq</text>
  <text x="498" y="244" text-anchor="middle" font-size="17" fill="#6b7280">one instruction at a time</text>

  <line x1="498" y1="254" x2="498" y2="284" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="512" y="275" font-size="17" fill="#6b7280">opcode · start</text>

  <!-- ===================== compute engines ===================== -->
  <rect x="118" y="284" width="760" height="204" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="132" y="306" font-size="19" fill="#475569">Compute engines</text>

  <!-- weights: from DDR to the three engines that have any. It passes OVER
       Residual and Pooling without a junction - neither has weights. -->
  <polyline points="810,88 810,142 900,142 900,324 198,324" fill="none"
            stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="890" y="134" text-anchor="end" font-size="17" fill="#b45309">weights (AXI4)</text>
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="7 4">
    <line x1="198" y1="324" x2="198" y2="334" marker-end="url(#aha)"/>
    <line x1="348" y1="324" x2="348" y2="334" marker-end="url(#aha)"/>
    <line x1="498" y1="324" x2="498" y2="334" marker-end="url(#aha)"/>
  </g>
  <g fill="#b45309">
    <circle cx="348" cy="324" r="3.5"/>
    <circle cx="498" cy="324" r="3.5"/>
  </g>

  <rect x="130" y="334" width="136" height="104" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="198" y="366" text-anchor="middle" font-size="21" fill="#1f2937">Stem</text>
  <text x="198" y="392" text-anchor="middle" font-size="17" fill="#6b7280">3×3 convolution</text>
  <text x="198" y="414" text-anchor="middle" font-size="17" fill="#6b7280">8 channels</text>

  <rect x="280" y="334" width="136" height="104" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="348" y="366" text-anchor="middle" font-size="21" fill="#1f2937">Pointwise</text>
  <text x="348" y="392" text-anchor="middle" font-size="17" fill="#6b7280">1×1 convolution</text>
  <text x="348" y="414" text-anchor="middle" font-size="18" font-weight="600" fill="#1d4ed8">512 MAC/cycle</text>

  <rect x="430" y="334" width="136" height="104" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="498" y="366" text-anchor="middle" font-size="21" fill="#1f2937">Depthwise</text>
  <text x="498" y="392" text-anchor="middle" font-size="17" fill="#6b7280">3×3 per channel</text>
  <text x="498" y="414" text-anchor="middle" font-size="17" fill="#6b7280">16 channels</text>

  <rect x="580" y="334" width="136" height="104" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="648" y="366" text-anchor="middle" font-size="21" fill="#1f2937">Residual</text>
  <text x="648" y="392" text-anchor="middle" font-size="17" fill="#6b7280">skip-branch add</text>

  <rect x="730" y="334" width="136" height="104" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="798" y="366" text-anchor="middle" font-size="21" fill="#1f2937">Pooling</text>
  <text x="798" y="392" text-anchor="middle" font-size="17" fill="#6b7280">global average</text>

  <!-- all five engines converge on one bus -->
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="198" y1="438" x2="198" y2="460"/>
    <line x1="348" y1="438" x2="348" y2="460"/>
    <line x1="498" y1="438" x2="498" y2="460"/>
    <line x1="648" y1="438" x2="648" y2="460"/>
    <line x1="798" y1="438" x2="798" y2="460"/>
  </g>
  <line x1="198" y1="460" x2="798" y2="460" stroke="#1d4ed8" stroke-width="2.5"/>
  <g fill="#1d4ed8">
    <circle cx="198" cy="460" r="3.5"/>
    <circle cx="348" cy="460" r="3.5"/>
    <circle cx="498" cy="460" r="3.5"/>
    <circle cx="648" cy="460" r="3.5"/>
    <circle cx="798" cy="460" r="3.5"/>
  </g>
  <text x="790" y="480" text-anchor="end" font-size="17" fill="#475569">one engine active per instruction</text>
  <line x1="498" y1="460" x2="498" y2="510" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>

  <!-- ===================== the one shared output stage ===================== -->
  <rect x="308" y="510" width="380" height="72" rx="5" fill="#fbfbfd" stroke="#374151" stroke-width="2.5"/>
  <text x="498" y="541" text-anchor="middle" font-size="22" fill="#1f2937">Shared output stage</text>
  <text x="498" y="566" text-anchor="middle" font-size="17" fill="#6b7280">bias add + requantize · 32 lanes</text>
  <text x="700" y="539" font-size="17" fill="#6b7280">one instance,</text>
  <text x="700" y="560" font-size="17" fill="#6b7280">used by all five</text>

  <line x1="498" y1="582" x2="498" y2="608" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>

  <!-- ===================== the one activation pool ===================== -->
  <rect x="288" y="608" width="420" height="88" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="498" y="640" text-anchor="middle" font-size="22" fill="#1f2937">Activation pool</text>
  <text x="498" y="665" text-anchor="middle" font-size="17" fill="#6b7280">act_buffer · 1.53 MB on-chip URAM</text>
  <text x="498" y="687" text-anchor="middle" font-size="17" fill="#1d4ed8">activations never leave the chip</text>

  <line x1="708" y1="652" x2="750" y2="652" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>

  <rect x="750" y="608" width="160" height="88" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="830" y="640" text-anchor="middle" font-size="21" fill="#1f2937">Classifier</text>
  <text x="830" y="665" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#6b7280">logit_out</text>
  <text x="830" y="687" text-anchor="middle" font-size="17" fill="#6b7280">4 classes</text>

  <line x1="910" y1="652" x2="962" y2="652" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="922" y="640" font-size="18" fill="#1f2937">class</text>

  <!-- the loop: the pool feeds the next instruction -->
  <polyline points="288,652 68,652 68,386 118,386" fill="none"
            stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="90" y="720" font-size="18" fill="#6b7280">the pool is read back as the next layer's input</text>

  <!-- ===================== legend ===================== -->
  <line x1="540" y1="714" x2="576" y2="714" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="584" y="720" font-size="17" fill="#6b7280">activations</text>
  <line x1="692" y1="714" x2="728" y2="714" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="736" y="720" font-size="17" fill="#6b7280">weights</text>
  <line x1="810" y1="714" x2="846" y2="714" stroke="#6b7280" stroke-width="1.5"/>
  <text x="854" y="720" font-size="17" fill="#6b7280">control</text>
</svg>
