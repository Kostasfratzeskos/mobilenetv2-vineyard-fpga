# vinecam.cfg - the kernel options vinecam depends on, as a config fragment.
#
# build.sh adds this to the PetaLinux project's linux-xlnx recipe. Most of
# these are already on in the ZCU104 BSP's kernel; they are stated here so the
# image does not depend on that staying true. An option the kernel version does
# not know is reported by the build as a warning and ignored.

# The accelerator: its CSR and DMA region handed to a user process (vine_uio.c).
# Built in, not a module, so uio_pdrv_genirq.of_id= on the command line applies.
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y

# The webcam: Video4Linux2 and the USB Video Class driver (v4l2cam.c).
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_USB_VIDEO_CLASS=y

# The DisplayPort monitor as /dev/fb0 (fbdev.c), through the DRM driver's
# fbdev emulation.
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
